miscInfo:
  uid: a7c3e91f2b584d6e9f0a1c2d3e4f5a6b
targets:
  M0G3519_nortos_keil:
    cppPreprocessAttrs:
      defineList:
        - __MSPM0G3519__
      incList:
        - .
        - ..
        - ../src/middle/hardware
        - ../src/middle
        - ../src/app
        - ../src/MSPM0G3519_Library/zf_common
        - ../src/MSPM0G3519_Library/zf_driver
        - A:/ti/mspm0_sdk_2_10_00_04/source
        - A:/ti/mspm0_sdk_2_10_00_04/source/third_party/CMSIS/Core/Include
        - .cmsis/include
        - RTE/_M0G3519_nortos_keil
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: AC6
    toolchainConfigMap:
      AC6:
        archExtensions: ""
        cpuType: Cortex-M0+
        floatingPointHardware: none
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler:
            $use: asm-auto
            misc-controls: ""
          beforeBuildTasks:
            - name: linking syscfg
              abortAfterFailed: true
              command: '"${projectRoot}/syscfg.bat" "${projectRoot}" M0G3519.syscfg'
              disable: false
              stopBuildAfterFailed: true
          c/cpp-compiler:
            language-c: c99
            language-cpp: c++11
            link-time-optimization: false
            optimization: level-2
            short-enums#wchar: true
            warnings: misra-compatible
          global:
            output-debug-info: enable
            use-microLIB: false
          linker:
            $outputTaskExcludes:
              - .bin
            misc-controls: A:/ti/mspm0_sdk_2_10_00_04/source/ti/driverlib/lib/keil/m0p/mspm0gx51x/driverlib.a --diag_suppress=L6329
            output-format: elf
        scatterFilePath: ./mspm0g3519.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x10000"
                startAddr: "0x20200000"
              noInit: false
              tag: IRAM
            - id: 2
              isChecked: true
              mem:
                size: "0x10000"
                startAddr: "0x20210000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x80000"
                startAddr: "0x00000000"
              tag: IROM
        useCustomScatterFile: true
    uploadConfigMap:
      Custom:
        bin: ""
        commandLine: '"A:/ti/XDS110_3519/dslite-CORTEX_M0P.bat" --config="A:/ti/XDS110_3519/user_files/configs/MSPM0G3519.ccxml" -e -f -v "${ExecutableName}.hex"'
        eraseChipCommand: '"A:/ti/XDS110_3519/dslite-CORTEX_M0P.bat" --config="A:/ti/XDS110_3519/user_files/configs/MSPM0G3519.ccxml" -e'
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: Custom
